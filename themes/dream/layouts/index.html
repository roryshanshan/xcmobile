    <img class="carousel-img" src="https://i.postimg.cc/BJ8HDbBh/fa2623135b9513ac365ff8855aa06dfe.jpg?dl=1" />
    <img class="carousel-img" src="https://i.postimg.cc/VmkjfDrP/edbec8b7b6c76ebf4692ff57f0af8c07.jpg?dl=1" />

<!-- 欢迎品牌介绍区域 -->
<section class="text-center mt-12 px-6 bg-white py-16">
  <h2 class="text-4xl font-bold text-gray-900 mb-6">Nature × Comfort × Design</h2>
  <p class="text-lg text-gray-700 max-w-3xl mx-auto leading-relaxed">
    Discover a unique glamping experience that blends modern design with the tranquility of nature. Our modular capsule houses offer comfort, style, and sustainability—perfect for retreats, resorts, and vacation rentals.
  </p>
  <div class="mt-10">
    <a href="/products/" class="inline-block bg-black hover:bg-gray-800 text-white text-lg font-semibold py-3 px-8 rounded-full transition">
      Explore Our Cabins
    </a>
  </div>
</section>

<!-- Google Translate 图标按钮 -->
<div id="google-translate-trigger" style="position:fixed;top:16px;right:16px;z-index:9999;cursor:pointer;">
  <img src="https://www.gstatic.com/images/branding/product/1x/translate_24dp.png" alt="Translate" width="28" height="28">
</div>
<div id="google_translate_element" style="display:none;position:fixed;top:56px;right:16px;z-index:9999;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      autoDisplay: false
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var trigger = document.getElementById('google-translate-trigger');
    var box = document.getElementById('google_translate_element');
    trigger.onclick = function(e) {
      e.stopPropagation();
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    };
    document.addEventListener('click', function(e) {
      if (!trigger.contains(e.target) && !box.contains(e.target)) {
        box.style.display = 'none';
      }
    });
  });
</script>

{{ end }}
