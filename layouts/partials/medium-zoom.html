<script type="module">
  import mediumZoom from 'https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/+esm';

  const contentRoot = document.getElementById('dream-single-post-content');
  if (contentRoot) {
    const galleryImages = Array.from(contentRoot.querySelectorAll('.xc-media-grid img'));
    galleryImages.forEach((img, index) => {
      img.classList.add('xc-lightbox-trigger');
      img.dataset.xcLightboxIndex = index;
      img.setAttribute('tabindex', '0');
      img.setAttribute('role', 'button');
      img.setAttribute('aria-label', `查看图片 ${index + 1}`);
    });

    const defaultZoomTargets = '#dream-single-post-content img:not(.xc-lightbox-trigger)';
    mediumZoom(defaultZoomTargets, {
      background: 'oklch(var(--b1))',
      margin: 24,
    });

    if (galleryImages.length) {
      const lightbox = document.createElement('div');
      lightbox.className = 'xc-lightbox';
      lightbox.setAttribute('aria-hidden', 'true');
      lightbox.innerHTML = `
        <div class="xc-lightbox__backdrop" data-xc-close="true"></div>
        <div class="xc-lightbox__dialog" role="dialog" aria-modal="true" aria-label="图片预览">
          <div class="xc-lightbox__toolbar">
            <div class="xc-lightbox__meta">
              <span class="xc-lightbox__eyebrow">Image Reference</span>
              <strong class="xc-lightbox__caption"></strong>
            </div>
            <div class="xc-lightbox__actions">
              <button type="button" class="xc-lightbox__nav" data-xc-prev="true" aria-label="上一张">
                <i class="fa-solid fa-arrow-left"></i>
              </button>
              <span class="xc-lightbox__counter"></span>
              <button type="button" class="xc-lightbox__nav" data-xc-next="true" aria-label="下一张">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
              <button type="button" class="xc-lightbox__close" data-xc-close="true" aria-label="关闭图片预览">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="xc-lightbox__stage">
            <img class="xc-lightbox__image" alt="" />
          </div>
        </div>
      `;

      document.body.appendChild(lightbox);

      const dialog = lightbox.querySelector('.xc-lightbox__dialog');
      const stage = lightbox.querySelector('.xc-lightbox__stage');
      const viewer = lightbox.querySelector('.xc-lightbox__image');
      const caption = lightbox.querySelector('.xc-lightbox__caption');
      const counter = lightbox.querySelector('.xc-lightbox__counter');
      const previousButton = lightbox.querySelector('[data-xc-prev]');
      const nextButton = lightbox.querySelector('[data-xc-next]');

      let currentIndex = 0;

      function resolveImageSource(image) {
        return image.currentSrc || image.src;
      }

      function resolveCaption(image) {
        const figure = image.closest('figure');
        const figcaption = figure ? figure.querySelector('figcaption') : null;
        return (figcaption && figcaption.textContent.trim()) || image.alt || `图片 ${currentIndex + 1}`;
      }

      function updateMode(image) {
        const width = image.naturalWidth || 1;
        const height = image.naturalHeight || 1;
        dialog.dataset.mode = height / width > 1.35 ? 'document' : 'fit';
        stage.scrollTop = 0;
        stage.scrollLeft = 0;
      }

      function render(index) {
        currentIndex = index;
        const sourceImage = galleryImages[currentIndex];
        const source = resolveImageSource(sourceImage);

        caption.textContent = resolveCaption(sourceImage);
        counter.textContent = `${currentIndex + 1} / ${galleryImages.length}`;
        viewer.src = source;
        viewer.alt = sourceImage.alt || '';

        if (viewer.complete) {
          updateMode(viewer);
        } else {
          viewer.onload = () => updateMode(viewer);
        }

        previousButton.disabled = galleryImages.length < 2;
        nextButton.disabled = galleryImages.length < 2;
      }

      function openLightbox(index) {
        render(index);
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('xc-lightbox-open');
      }

      function closeLightbox() {
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('xc-lightbox-open');
      }

      function step(offset) {
        const nextIndex = (currentIndex + offset + galleryImages.length) % galleryImages.length;
        render(nextIndex);
      }

      galleryImages.forEach((image, index) => {
        image.addEventListener('click', () => openLightbox(index));
        image.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openLightbox(index);
          }
        });
      });

      lightbox.addEventListener('click', event => {
        const target = event.target.closest('[data-xc-close], [data-xc-prev], [data-xc-next]');
        if (!target) {
          return;
        }

        if (target.hasAttribute('data-xc-close')) {
          closeLightbox();
          return;
        }

        if (target.hasAttribute('data-xc-prev')) {
          step(-1);
          return;
        }

        if (target.hasAttribute('data-xc-next')) {
          step(1);
        }
      });

      document.addEventListener('keydown', event => {
        if (!lightbox.classList.contains('is-open')) {
          return;
        }

        if (event.key === 'Escape') {
          closeLightbox();
        } else if (event.key === 'ArrowLeft') {
          step(-1);
        } else if (event.key === 'ArrowRight') {
          step(1);
        }
      });
    }
  }
</script>
