[params]
enableMenu = true
github = { href = "https://github.com/g1eny0ung", title = "GitHub" }
favicon = "favicon.ico"

lightTheme = "emerald"
darkTheme = "forest"

author = "Gavin"
avatar = "https://i.postimg.cc/G3tYDFp6/202504112221048.png"
email = "gavin@mobilehouse.asia"
organizationName = "XC Mobile House"
telephone = "+8619906365856"
whatsappURL = "https://wa.me/8619906365856"
linkedinURL = "https://www.linkedin.com/newsletters/7311612702156603393/?displayConfirmation=true"
addressLocality = "Qingzhou"
addressRegion = "Shandong"
addressCountry = "CN"
addressCountryName = "China"
siteStartYear = 2016

# Syntax highlighting
# customSyntaxHighlighting = true

stickyNav = true
collapseNavItems = ["posts"]
noDefaultSummaryCover = true
showTableOfContents = true
showSummaryCoverInPost = true
imageZoomableInPost = true
reorderShares = ["x", "facebook", "whatsapp"]

[params.twikoo]
enabled = false
envID = ""
region = ""
lang = "en"

# [params.advanced]
# customCSS = ["css/custom.css"]
# customJS = []

# [params.experimental]
jsDate = true
jsDateFormat = "yyyy年MM月dd日"

disableRobotsTXT = false
disableKinds = ["taxonomy", "term"]

[outputs]
home = ["HTML", "RSS", "SITEMAP"]

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

enableEmoji = true
hasCJKLanguage = true

[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
