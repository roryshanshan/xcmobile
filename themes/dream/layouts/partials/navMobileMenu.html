<ul class="menu">
  {{ range site.Menus.main }}
    {{ if and (not .Parent) (ne .Identifier "other") (ne (lower .Name) "other") }}
      <li>
        <a href="{{ .URL | relLangURL }}">{{ .Name }}</a>
        {{ if .Children }}
          <ul>
            {{ range .Children }}
              <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
            {{ end }}
          </ul>
        {{ end }}
      </li>
    {{ end }}
  {{ end }}
</ul>
